name: Release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional exact main commit SHA (defaults to current main)
        type: string
        required: false
      tag:
        description: Optional release tag (otherwise next patch version)
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: canonical-paper-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.choose.outputs.publish }}
      revision: ${{ steps.choose.outputs.revision }}
    steps:
      - id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TESTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          MANUAL_REVISION: ${{ inputs.revision }}
        run: |
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          revision="$current"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            revision="$TESTED_REVISION"
          elif [[ -n "$MANUAL_REVISION" ]]; then
            revision="$MANUAL_REVISION"
          fi
          if [[ "$current" != "$revision" ]]; then
            echo "main advanced after CI (or manual revision is stale): skip release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested publication revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: typst-community/setup-typst@v5
      - run: bun install --frozen-lockfile
      - name: Rebuild and verify checked-in publication matches the paper source
        run: |
          bun run publication
          git diff --exit-code -- README.md ODBORNA_PRACE.pdf bun.lock
      - name: Publish exact PDF/Markdown artifacts and dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.gate.outputs.revision }}
          REQUEST_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$REQUEST_TAG" ]]; then
            TAG="$REQUEST_TAG"
          else
            PREVIOUS="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [[ -z "$PREVIOUS" ]]; then PREVIOUS="v0.0.0"; fi
            VERSION="${PREVIOUS#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Publishing $TAG from $REVISION"
          gh release create "$TAG" ODBORNA_PRACE.pdf README.md --target "$REVISION" --title "$TAG" --generate-notes
          gh workflow run deploy-docs.yml --ref main -f release_tag="$TAG"
