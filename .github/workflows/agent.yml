name: Autonomous Agent

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  agent:
    uses: marius-patrik/DarkFactory/.github/workflows/agent.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      agent-enabled: ${{ vars.AGENT_ENABLED }}
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd372b6c921316b0ee69d2d0b50a2e584f18"
    secrets: inherit
