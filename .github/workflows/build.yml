name: Sazba práce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalace Typst
        uses: typst-community/setup-typst@v4

      - name: Sazba PDF
        run: typst compile --font-path fonts main.typ prace.pdf

      - name: Uložení PDF jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: prace-pdf
          path: prace.pdf
          if-no-files-found: error
