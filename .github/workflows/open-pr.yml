name: Open Pull Request

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Head branch name (e.g. feature/my-feature)'
        required: true
        type: string
      title:
        description: 'Pull Request title'
        required: true
        type: string
      body:
        description: 'Pull Request description'
        required: true
        type: string
      base:
        description: 'Target base branch'
        required: false
        type: string
        default: 'main'
      draft:
        description: 'Create as draft PR'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  open-pr:
    uses: marius-patrik/DarkFactory/.github/workflows/open-pr.yml@f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d
    with:
      branch: ${{ inputs.branch }}
      title: ${{ inputs.title }}
      body: ${{ inputs.body }}
      base: ${{ inputs.base }}
      draft: ${{ inputs.draft }}
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d"
    secrets: inherit
