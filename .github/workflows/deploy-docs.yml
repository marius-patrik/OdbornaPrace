name: Deploy Documentation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the successfully published paper release
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: odbornaprace-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Download the exact released PDF
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-artifacts
          gh release download "$PAPER_RELEASE_TAG" --pattern ODBORNA_PRACE.pdf --dir release-artifacts
      - name: Build embedding-only publication site
        env:
          PAPER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun scripts/site.ts
      - name: Publish GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          commit-message: "docs: publish PDF from release ${{ inputs.release_tag }}"
