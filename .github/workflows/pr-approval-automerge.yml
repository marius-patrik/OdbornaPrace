name: PR Approval and Auto-Merge

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  pr-approval-automerge:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@5f181968a4f8d0a15c91ba8fa0c3cb0d62f27bea
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "5f181968a4f8d0a15c91ba8fa0c3cb0d62f27bea"
    secrets: inherit
