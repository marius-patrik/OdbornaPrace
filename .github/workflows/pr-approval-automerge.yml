name: PR Approval and Auto-Merge

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  pr-approval-automerge:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9"
    secrets: inherit
