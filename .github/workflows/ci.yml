name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: canonical-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: typst-community/setup-typst@v5
      - run: bun install
      - name: Generate PDF and README from paper/main.typ
        run: bun run publication
      - name: Commit canonical generated outputs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- ODBORNA_PRACE.pdf README.md bun.lock && test -f bun.lock; then
            echo "Canonical publication matches paper/main.typ."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ODBORNA_PRACE.pdf README.md bun.lock
          git commit -m "chore: regenerate publication from paper/main.typ"
          git push origin "HEAD:$TARGET_BRANCH"
          # The generated commit made with GITHUB_TOKEN will not trigger a push workflow.
          gh workflow run ci.yml --ref "$TARGET_BRANCH"
