name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: marius-patrik/DarkFactory/.github/workflows/ci.yml@39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9"
    secrets: inherit
