name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: marius-patrik/DarkFactory/.github/workflows/ci.yml@234d84daa826cc3ef775b39009ee36c76ecf57a2
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "234d84daa826cc3ef775b39009ee36c76ecf57a2"
    secrets: inherit
