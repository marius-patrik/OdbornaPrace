name: Verify Bound Issue

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-pr-issue:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@480900aaac7f6e8f0284aa5e10385218e8890723
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "480900aaac7f6e8f0284aa5e10385218e8890723"
    secrets: inherit
