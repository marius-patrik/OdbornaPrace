name: Verify Bound Issue

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-pr-issue:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@4f26dd3a4b23e120ac40c94836f3e065d1f82237
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd3a4b23e120ac40c94836f3e065d1f82237"
    secrets: inherit
