name: Verify Bound Issue

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-pr-issue:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@234d84daa826cc3ef775b39009ee36c76ecf57a2
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "234d84daa826cc3ef775b39009ee36c76ecf57a2"
    secrets: inherit
