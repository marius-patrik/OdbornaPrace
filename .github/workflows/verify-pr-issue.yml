name: Verify Bound Issue

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-pr-issue:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "f758971e77cdbb6ba5f2dbdbba3146c7f77b4e8d"
    secrets: inherit
