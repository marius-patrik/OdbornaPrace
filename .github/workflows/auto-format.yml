name: Auto Format

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-format:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@1e6bdb0e060ea8dbf614bbec1d1fa7b9f3650228
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "1e6bdb0e060ea8dbf614bbec1d1fa7b9f3650228"
    secrets: inherit
