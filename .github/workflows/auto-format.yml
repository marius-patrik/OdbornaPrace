name: Auto Format

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-format:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@c61e39e7be5aa882c5f106606a6c0bb1b48348bc
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "c61e39e7be5aa882c5f106606a6c0bb1b48348bc"
    secrets: inherit
