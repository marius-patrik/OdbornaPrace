name: Auto Format

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-format:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@234d84d9bc24ee246fc0b91d29759c8699b24479
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "234d84d9bc24ee246fc0b91d29759c8699b24479"
    secrets: inherit
