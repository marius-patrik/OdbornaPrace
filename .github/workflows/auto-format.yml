name: Auto Format

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-format:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@939f862878dfa6f365e2791cc7b1ad06bcbc3316
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "939f862878dfa6f365e2791cc7b1ad06bcbc3316"
    secrets: inherit
