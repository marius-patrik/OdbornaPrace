name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@02490f3012ad0b91beac0c20c2d807adb1647932
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "02490f3012ad0b91beac0c20c2d807adb1647932"
    secrets: inherit
