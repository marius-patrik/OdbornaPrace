name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@1e6bdb0c502deccf5b79b548f089fd07742981a7
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "1e6bdb0c502deccf5b79b548f089fd07742981a7"
    secrets: inherit
