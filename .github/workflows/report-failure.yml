name: Report Pipeline Failure

on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@6d42a0ea793a3e1fc26876ff99662a94f82bb987
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "6d42a0ea793a3e1fc26876ff99662a94f82bb987"
    secrets: inherit
